name: Release

on:
  # #770 -- main / develop-* への push でも release CI を走らせて
  # Swatinem/rust-cache の canonical キャッシュを生成する。pull_request + tags
  # only だと main / develop ブランチ上で CI が走らないため GitHub Actions Cache
  # 上に branch 由来のキャッシュが存在せず、build-windows の rust-cache が
  # "No cache found." で毎回フルビルド (398s の tauri build)。push で warm された
  # cache を PR が restore-key prefix fallback で継承することで incremental
  # build (~30-60s) に短縮する。
  #
  # GitHub Actions の AND 仕様により paths filter は branch push と tag push の
  # 両方に適用される。release tag commit は pyproject.toml の version bump 等を
  # 含む (v0.2.0 実績で paths 対象を多数 touch) ため tag push 時の paths filter は
  # 実用上問題ない。万一 paths にマッチしない tag commit が必要になった場合は
  # workflow_dispatch で手動実行できる。
  # /iterate-review Round 2 R2-1 fix + Round 3 R3-1 訂正 (PR #775): push trigger の paths filter を撤去。
  # 経緯: 元は paths filter でファイル絞り込みしていたが、GitHub Actions の挙動として
  # branches/tags filter unmatch (claude/* 等) でも paths match で workflow run が
  # phantom 作成され conclusion=failure として記録される問題があった
  # (claude/nervous-hoover-464244 で 5 連続 failure を実証)。
  # paths を撤去することで branches=[main, develop-*] + tags=[v*.*.*] の strict
  # 判定のみとなり、claude/* push では run 自体が作成されなくなる**期待**。
  # 代償として main / develop-* / tag への無関係 path 変更 push でも release.yml
  # が起動するが、これらは元々頻度低 + cache warm-up 用途 (#770) として有用なため許容。
  # pull_request 側の paths filter は維持 (PR validation 範囲を絞る)。
  #
  # R3-1 訂正 (重要): R2 fix の empirical 検証は **post-merge (develop-0.3.0 → main
  # 反映) 以降の future push で初めて可能**。本 PR 期間中は GitHub Actions が
  # `push.paths` filter を default branch (main) の workflow 定義で評価する known
  # behavior により、main の release.yml が旧 paths filter を保持している間は claude/*
  # push の phantom run 作成は継続する (commit 2d17747 push 自体が phantom run
  # 25985396510 を作成した事実で実証)。defense-in-depth `if:` 条件は phantom run の
  # 0 jobs 維持 (= conclusion=failure だが functional 影響ゼロ) を担保。
  #
  # Retrospective (issue #786 / PR #788): 上記 R3-1 訂正の「main paths filter で
  # gating」仮説は **誤り** だった。真の root cause = `shell: ${{ matrix.shell }}` が
  # GitHub Actions schema-invalid (`jobs.<job_id>.steps[*].shell` field は matrix
  # context をサポートしない、公式 context availability table 参照)。Codex
  # /codex:rescue (agentId a9a21c7545477c99c) で独立調査により確定。PR #788 で
  # `build-windows.defaults.run.shell: ${{ matrix.shell }}` 移行 + step 個別
  # `shell: ${{ matrix.shell }}` 削除 (9 箇所) により解消。R2 fix の paths filter
  # 撤去自体は別目的 (push trigger を strict 判定にして無関係 path push の run 抑止)
  # で benefit があるため維持しているが、phantom run の真因ではなかった。詳細は
  # PR #786 / #788 / docs/superpowers/specs/2026-05-17-v020-v021-retro-codex-integration-design.md §9 を参照。
  push:
    branches: [main, "develop-*"]
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-portable-zip.ps1'
      - 'scripts/extract_release_notes.py'
      # #911: version-check job が呼ぶバージョン突合スクリプト。単独変更でも
      # release CI で実際に走らせて、ガードが壊れたまま merge されるのを防ぐ。
      - 'scripts/check_version_consistency.py'
      - 'pyproject.toml'
      # #916: build venv の pip install が -c constraints.txt を通すようになったため、
      # constraints.txt の単独変更 (cv2 / numpy / scipy の bump 等) も Portable ZIP
      # build と smoke test を PR 時点で走らせる。ここに入れないと、frozen artifact の
      # regression を最も捕まえやすい検査を素通りして merge できてしまう。
      - 'constraints.txt'
      # GUI 関連: tauri build を release CI で実行するため (#570)。
      # tauri.conf.json / Cargo.toml / Rust src / TS src / vite config の単独変更でも
      # release CI を trigger し、Tauri build 失敗の検出が遅れないようにする。
      - 'gui/package.json'
      - 'gui/package-lock.json'
      - 'gui/src-tauri/**'
      - 'gui/src/**'
      - 'gui/index.html'
      - 'gui/vite.config.ts'
      - 'gui/tsconfig*.json'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version string used for dry-run build. Defaults to pyproject.toml version.'
        required: false
        type: string

jobs:
  version-check:
    # /iterate-review Round 1 Finding 3 fix: push event の branches filter unmatch
    # (claude/* 等) でも paths filter match で workflow run が created され
    # startup_failure として記録される GitHub Actions 挙動を回避。
    # 各 job entry で event/ref を明示判定し、main / develop-* / v*.*.* tag 以外の
    # push は skipped に倒す。pull_request / workflow_dispatch は影響なし。
    if: github.event_name != 'push' || github.ref_name == 'main' || startsWith(github.ref_name, 'develop-') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      # fetch-tags は必須。既定の checkout は tag push でも **tag object を
      # 取得しない** -- 実測 (2026-09-02, run 33528826207):
      #
      #   git fetch ... --depth=1 origin +074a47e...:refs/tags/v0.3.1
      #   git for-each-ref --format='%(refname) %(objecttype)' 'refs/tags/*'
      #   -> refs/tags/v0.3.1 commit
      #
      # commit SHA を tag 名へマップするだけなので、ローカルの ref は
      # **lightweight** になり `%(taggerdate)` が常に空を返す。annotated tag を
      # 正しく打っていても version-check が「taggerdate を取得できません」で
      # 落ちる = このガードは導入以来 1 度も本来の日付判定に到達していなかった。
      # (#948 導入時の spec §8.2 O-6 は「既定でも読める」と記録していたが、
      #  実測はそうなっていない。)
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      # #911: バージョン保持箇所は pyproject.toml だけではない (実測 6 ファイル)。
      # 箇所リストの正は scripts/check_version_consistency.py の VERSION_LOCATIONS。
      # tag push 時は tag とも突合し、それ以外の起動 (PR / workflow_dispatch /
      # branch push) では箇所間の相互一致だけを検証する。
      # #948 / #918 -- tag push 時は CHANGELOG 見出し日付 (= タグを打つ日、JST) と
      # バンプ方向も検査する。
      #
      # 基準日は annotated tag の taggerdate **のみ**を使う。規約
      # (docs/release-process.md §タグ運用) が定義する「タグを打つ日」そのもの。
      #
      # **読めるようにするのは呼び出し側の責任**である。既定の checkout では
      # 読めない (上の checkout step のコメントに実測を記録)。tag object を
      # 取得するのは (a) checkout の `fetch-tags: true` と (b) 下の明示 refspec
      # fetch の 2 段で、どちらか片方でも成立すればよい形にしてある。
      #
      # 旧記述は「既定 fetch-depth: 1 でも読める (spec §8.2 O-6 の決着)」と
      # 書いていたが、**これは誤り**だった (2026-09-02 実測で反証)。
      #
      # **github.event.head_commit.timestamp へ fallback しない** (Codex
      # adversarial-review high finding)。あれは「タグが指す commit の日時」で
      # あってタグを打った日時ではないので、commit とタグ push が日を跨ぐと
      # 規約とズレた日付を「正」として通してしまう。しかもそれが起きるのは
      # lightweight tag を打った時 = 規約 (`git tag -a`) 違反時だけなので、
      # 弱い基準で通すより落として打ち直させる方が正しい。
      - name: Verify version consistency across all locations
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            python scripts/check_version_consistency.py
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"

          # tag ref を明示 refspec で取り直す。checkout 側の `fetch-tags: true` に
          # 加えた二重化で、**checkout の実装詳細に依存しないため**にここに置く。
          # 既定の checkout は commit SHA を tag 名へマップするだけで annotated
          # tag object を持ってこない (実測 run 33528826207)。その状態では
          # `%(taggerdate)` が空になり、正しく打ったタグでも下で必ず落ちる。
          # `refs/tags/<tag>:refs/tags/<tag>` の refspec なら tag object ごと来る。
          # 失敗しても即 fail にはしない ((a) が効いていれば下の判定は通る) が、
          # **黙らせない**。握り潰すと、CI 側 (network / permission) の失敗でも
          # 下の「annotated tag で打ち直してください」だけが出て、運用者に無関係な
          # 原因を疑わせる。今回まさにその誤帰属で 1 サイクル失っている。
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}" \
            || echo "::warning::refs/tags/${TAG} の fetch に失敗しました (CI 側要因の可能性)。以降で taggerdate が取れない場合はこの warning を先に疑うこと"

          # lightweight tag / ref 欠落では空文字が返る (exit 0)。
          REFERENCE_DATE="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/${TAG}")"
          if [[ -z "${REFERENCE_DATE}" ]]; then
            echo "--- diagnostics ---"
            echo "ref object type: $(git cat-file -t "${TAG}" 2>&1 || true)"
            git for-each-ref --format='%(refname) %(objecttype)' 'refs/tags/*' || true
            echo "::error::${TAG} から taggerdate を取得できません。**上に fetch の warning が出ていないかを先に確認**すること (出ていれば CI 側要因で、タグの打ち方は無関係)。warning が無ければ lightweight tag なので annotated で打ち直してください (git tag -a ${TAG} -m '...')。CHANGELOG 見出し日付の基準日はタグ作成時刻であり、commit 日時で代用しません (docs/release-process.md §タグ運用)"
            exit 1
          fi
          echo "基準日: annotated tag ${TAG} の taggerdate = ${REFERENCE_DATE}"

          python scripts/check_version_consistency.py \
            --tag "${TAG}" \
            --changelog-date-from "${REFERENCE_DATE}"

      - name: Resolve version
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            OVERRIDE='${{ inputs.version_override }}'
            VERSION="${OVERRIDE:-$PYPROJECT_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

  build-windows:
    needs: version-check
    runs-on: windows-latest
    # M1 (Refs spec L-α, Refs #737): PS 7+ (pwsh) と PS 5.1 (powershell) を dual matrix で実行。
    # PS 5.1 silent regression (F1 #729 BOM 系) を CI で検出する。
    # upload-artifact は pwsh のみ (matrix.shell == 'pwsh' で gate)、PS 5.1 は smoke-test 専用。
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    name: build-windows (${{ matrix.shell }})
    # build-windows job は matrix.shell (pwsh / powershell dual matrix) を
    # `defaults.run.shell` 経由で適用する。GitHub Actions schema 仕様で
    # `jobs.<job_id>.steps[*].shell` field は matrix context をサポートしない
    # ため (PR #788 / issue #786 で確定)、step 個別の `shell:` 指定では matrix.shell
    # を展開できない。`defaults.run.shell` field は matrix context 参照可能。
    # version-check / release job は ubuntu-latest 上で意図的に `shell: bash`
    # を step 個別指定しているが、これは shell variation 不要なため。
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # build-portable-zip.ps1 reuses the BtbN FFmpeg zip from this directory
      # when the digest matches, and saves freshly downloaded copies here.
      # actions/cache persists the directory across runs keyed by asset SHA256.
      ALLAGANEYE_BUILD_CACHE_DIR: ${{ github.workspace }}/build-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      # Node + Rust toolchain for Tauri GUI build (#570). bundle.active = false
      # in tauri.conf.json so `npm run tauri build` only compiles the .exe and
      # skips NSIS/MSI installer generation; the resulting allaganeye-gui.exe
      # is copied as-is into the Portable ZIP payload by
      # scripts/build-portable-zip.ps1 at packaging time (no rename, the cargo
      # binary name without whitespace is used directly).
      # #770 -- npm cache を有効化して `npm install` の registry fetch 時間を短縮
      # (22s → ~10s)。gui-rust ジョブ (ci.yml) と同じ cache key で共有される。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Cache FFmpeg archive
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-cache
          key: btbn-ffmpeg-win64-lgpl-shared-8.1-e27598e612078f25d3e9cf245ce5042990f2602146e5a6f8287b143b0dce0e95

      # #770 -- npm install (lock loose) から npm ci (lock strict) に変更。
      # release CI では package-lock.json と一致する厳密な再現を保証したい。
      # npm cache (setup-node) と組み合わせて再現性向上 + 速度向上。
      - name: Install GUI dependencies (#570)
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Build Tauri GUI binary (#570)
        working-directory: gui
        run: npm run tauri build

      # #752 -- PyInstaller install. build-portable-zip.ps1 creates its own
      # venv and installs PyInstaller there, so this base Python install is
      # NOT strictly required for the build itself. We do it here anyway to
      # surface version pin issues early (before the build script noise) and
      # for actions/cache to amortize PyInstaller wheel downloads across runs.
      - name: Install PyInstaller (#752)
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt は build venv 側と規約を揃えるため (#916)。この
          # base Python は ZIP の中身には入らない (build script が自前の venv を
          # 作る) が、「package を入れる pip install には必ず -c を付ける」規約を
          # workflow 横断で一様にしておく。tests/test_dependency_pins.py の
          # test_all_workflow_pip_installs_use_constraints が全 workflow を検査する。
          python -m pip install -r scripts/installer/requirements-pyinstaller.txt -c constraints.txt

      - name: Build Portable ZIP (skip archive)
        run: ./scripts/build-portable-zip.ps1 -Version '${{ needs.version-check.outputs.version }}' -SkipArchive

      # build-portable-zip.ps1 は Tauri exe が見つからない場合 Write-Warning で
      # 続行する (CLI-only ZIP として artifact 化) ため、payload に exe が含まれない
      # 回帰を smoke test の前に明示 fail させる (#570 受け入れ条件 #3)。
      - name: Verify allaganeye-gui.exe is bundled (#570)
        run: |
          $version = '${{ needs.version-check.outputs.version }}'
          $exePath = "build/portable/allaganeye-v$version/allaganeye-gui.exe"
          if (-not (Test-Path $exePath)) {
            throw "allaganeye-gui.exe not found in payload: $exePath (build-portable-zip.ps1 may have hit the auto-detect Write-Warning path - check 'Build Tauri GUI binary' step)"
          }
          $size = (Get-Item $exePath).Length / 1MB
          Write-Host "allaganeye-gui.exe bundled at $exePath ($([math]::Round($size, 2)) MB)"

      # #752 -- baseline measurement: capture file count + size by top-dir /
      # extension for PR before/after comparison. The JSON artifact is reused
      # in the Pester regression assertion that locks in the reduction floor.
      - name: Measure Portable ZIP baseline (#752)
        if: matrix.shell == 'pwsh' && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
        run: |
          $version = '${{ needs.version-check.outputs.version }}'
          $payload = "build/portable/allaganeye-v$version"
          $outFile = "build/portable/baseline.json"
          $json = & ./scripts/measure-portable-zip-baseline.ps1 -PayloadDir $payload -Format Json
          # #752 -- BOM-less UTF-8 で書き出す。Out-File -Encoding utf8 は PS 5.1
          # で BOM 付き、PS 7+ で BOM-less と version 依存になるため [IO.File]
          # 経由で encoding を explicit に揃える (PR #736 / #729 と同じ canonical
          # pattern、`feedback_ps_setcontent_utf8_bom.md` 参照)。
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) $outFile),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "--- Baseline measurement (#752) ---"
          & ./scripts/measure-portable-zip-baseline.ps1 -PayloadDir $payload -Format Human
          Write-Host "Saved baseline JSON to: $outFile"

      # branch push (warm-up 目的、artifact upload なし) では smoke test を skip
      # する (~5min 短縮)。PR validation と release tag push、workflow_dispatch
      # の手動実行では従来通り実行 (CI-3, v0.3.0 cycle 改善)。
      - name: Smoke test (run launcher --version from built payload)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        run: |
          $version = '${{ needs.version-check.outputs.version }}'
          $payload = "build/portable/allaganeye-v$version"
          if (-not (Test-Path $payload)) {
            throw "Payload directory not found: $payload"
          }
          Push-Location $payload
          try {
            # cmd.exe -c so the .bat runs end-to-end (including final pause).
            # Empty stdin via '' | pipes a newline that releases the pause.
            $output = '' | & cmd.exe /c "allaganeye.bat --version" 2>&1
            $exitCode = $LASTEXITCODE
            $joined = $output | Out-String
            Write-Host '--- allaganeye.bat --version output ---'
            Write-Host $joined
            Write-Host "--- exit code: $exitCode ---"
            if ($exitCode -ne 0) {
              throw "allaganeye.bat --version exited with $exitCode"
            }
            if ($joined -notmatch 'allaganeye') {
              throw "Expected 'allaganeye' marker in version output, got: $joined"
            }
          }
          finally {
            Pop-Location
          }

      - name: Smoke test Level B (run launcher detect on 3s fixture)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        run: |
          # GitHub Actions の `shell: pwsh` は暗黙的に
          # `$PSNativeCommandUseErrorActionPreference = $true` を設定するため、
          # native command (cmd.exe) が non-zero exit (今回 4) を返すと PS が
          # auto-stop してしまう。Level B は exit 4 を想定値として扱うので無効化。
          $PSNativeCommandUseErrorActionPreference = $false
          $version = '${{ needs.version-check.outputs.version }}'
          $payload = "build/portable/allaganeye-v$version"
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\smoke_3s.mp4'
          if (-not (Test-Path $fixture)) {
            throw "Fixture not found: $fixture"
          }
          Push-Location $payload
          try {
            # stderr redirect は cmd.exe 内で行う (`2>&1` を cmd 引数の内側に置く)。
            # PowerShell 側で `2>&1` すると native command の stderr が
            # NativeCommandError として PS の error stream に wrap され、
            # exit code が想定値でも step 全体が failure 扱いされる。
            $output = '' | & cmd.exe /c "allaganeye.bat detect `"$fixture`" -o smoke-output\ 2>&1"
            $exitCode = $LASTEXITCODE
            # GitHub Actions の `pwsh` shell は script 末尾に
            # `if (Test-Path variable:/LASTEXITCODE) { exit $LASTEXITCODE }` を
            # 自動付加する。$LASTEXITCODE を消費直後に 0 にリセットしないと
            # 想定値 (4) が step exit code として伝搬し step failure 扱いになる。
            $LASTEXITCODE = 0
            $joined = $output | Out-String
            Write-Host '--- allaganeye.bat detect output ---'
            Write-Host $joined
            Write-Host "--- exit code: $exitCode ---"
            if ($exitCode -ne 0 -and $exitCode -ne 4) {
              throw "allaganeye.bat detect exited with $exitCode (expected 0 or 4)"
            }
            if ($exitCode -eq 0 -and -not (Test-Path 'smoke-output\metadata.json')) {
              throw "Expected smoke-output\metadata.json to exist for exit 0, but it is missing"
            }
          }
          finally {
            # smoke-output/ が upload-artifact (path: build/portable/...) 配下に
            # 残ると配布物 artifact に test 痕跡が混入する (現状 exit 4 経路では
            # 未作成だが将来 exit 0 経路を通った場合の latent pollution risk)。
            # cleanup 失敗 (ファイルロック等) で smoke-test 自体を fail 扱いに
            # しないため -ErrorAction SilentlyContinue。
            if (Test-Path 'smoke-output') {
              Remove-Item -Recurse -Force 'smoke-output' -ErrorAction SilentlyContinue
            }
            Pop-Location
          }

      # #668 -- Verify integrity-check fall-through in release builds:
      # copy payload, remove a known bundled file, run --version, assert
      # exit code 7. Confirms `#[cfg(not(debug_assertions))]` guard is
      # active for release profile builds and that
      # `integrity-manifest.json` is generated by the build script.
      - name: Smoke test (integrity-check fall-through, expect exit 7)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = '${{ needs.version-check.outputs.version }}'
          $payload = "build/portable/allaganeye-v$version"
          $verifyDir = "verify/allaganeye-v$version"

          # Copy payload to a sibling dir so artifact upload is unaffected.
          if (Test-Path verify) { Remove-Item -Recurse -Force verify }
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          Copy-Item -Recurse "$payload" "verify/" -Force

          # Sanity: integrity-manifest.json must exist in the verify copy.
          $manifest = Join-Path $verifyDir 'integrity-manifest.json'
          if (-not (Test-Path $manifest)) {
            throw "integrity-manifest.json not found in built payload: $manifest"
          }

          # Remove a bundled file the manifest is known to track.
          # #752: lib/ ディレクトリは PyInstaller --onedir 化で廃止。frozen bundle
          # entry point の allaganeye/allaganeye.exe を消すと bat → allaganeye.exe
          # 起動自体が失敗するため、_internal/ 内の fanfare.npz を victim に変更
          # (manifest 対象ファイル、削除しても bat → allaganeye.exe 起動は成功 →
          # exit 7 を辿れる)。
          $victim = Join-Path $verifyDir 'allaganeye\_internal\allaganeye\audio\refs\fanfare.npz'
          if (-not (Test-Path $victim)) {
            throw "expected bundled file not present (build broken?): $victim"
          }
          Remove-Item -Force $victim

          # Drive --version and capture the exit code without auto-stop.
          Push-Location $verifyDir
          try {
            $output = '' | & cmd.exe /c "allaganeye.bat --version 2>&1"
            $exitCode = $LASTEXITCODE
            $LASTEXITCODE = 0  # release.yml 既存 idiom: native 戻り値を step 末尾 auto-exit に伝播させない
            Write-Host '--- integrity-check --version output ---'
            Write-Host ($output | Out-String)
            Write-Host "--- exit code: $exitCode (expected 7) ---"
            if ($exitCode -ne 7) {
              throw "integrity check did not produce exit code 7 (got $exitCode)"
            }
          }
          finally {
            Pop-Location
            # PR #702 review #6: cleanup を finally に移動して throw 時 (exit code != 7) も
            # verify/ が残らないようにする (act 等の local CI 実行で害が出ないため)。
            if (Test-Path verify) { Remove-Item -Recurse -Force verify }
          }

      # Upload the expanded payload folder; actions/upload-artifact zips it once
      # on its own, which avoids the previous "zip inside a zip" artifact.
      #
      # #770 -- main / develop-* への branch push は rust-cache warm-up が目的で
      # release artifact は不要なため skip する。tag push (release tag) と
      # pull_request (build 確認用) では従来通り upload する。
      #
      # M1 (Refs spec L-α): matrix で 2 shell 並列実行する場合、artifact 名衝突を
      # 避けるため pwsh のみで upload。PS 5.1 job は smoke-test 専用で artifact 不要。
      - uses: actions/upload-artifact@v4
        if: matrix.shell == 'pwsh' && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        with:
          name: allaganeye-windows-v${{ needs.version-check.outputs.version }}
          path: build/portable/allaganeye-v${{ needs.version-check.outputs.version }}
          if-no-files-found: error

      # #752 -- Upload baseline.json separately so PR review / Task 19 PR-body
      # update can retrieve before/after numbers via `gh run download`. The main
      # `allaganeye-windows-v*` artifact only contains the payload subdir; the
      # baseline JSON lives at the parent (build/portable/) so it needs its
      # own upload step. Gated to pwsh-only matching the main upload gate
      # (avoid duplicate artifacts from powershell.exe runner).
      - uses: actions/upload-artifact@v4
        if: matrix.shell == 'pwsh' && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        with:
          name: allaganeye-baseline-v${{ needs.version-check.outputs.version }}
          path: build/portable/baseline.json
          if-no-files-found: error

  release:
    needs: [version-check, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - uses: actions/download-artifact@v4
        with:
          name: allaganeye-windows-v${{ needs.version-check.outputs.version }}
          path: dist/allaganeye-v${{ needs.version-check.outputs.version }}

      # Re-create the single release archive from the payload folder. Keeping
      # the top-level allaganeye-v<version>/ directory inside the zip preserves
      # the extraction layout users have relied on since v0.1.0.
      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r "allaganeye-v${{ needs.version-check.outputs.version }}-windows.zip" "allaganeye-v${{ needs.version-check.outputs.version }}"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: python scripts/extract_release_notes.py '${{ needs.version-check.outputs.version }}' release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/allaganeye-v*-windows.zip
          body_path: release-notes.md
          generate_release_notes: false
