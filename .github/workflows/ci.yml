name: CI

on:
  # #767 -- main / develop-* への push でも CI を走らせて Swatinem/rust-cache の
  # canonical キャッシュを生成する。pull_request only だと main / develop ブランチ
  # 上で CI が走らないため GitHub Actions Cache 上に branch 由来のキャッシュが
  # 存在せず、PR ごとに rust-cache が "No cache found." で毎回フルビルドしていた
  # (gui-rust 228s)。push で warm された cache を PR が restore-key prefix
  # fallback で継承することで incremental build (~30-60s) に短縮する。
  push:
    branches: [main, "develop-*"]
  # #947 -- pull_request の branches filter は **PR の base** に適用される。
  # `release/*` を統合ブランチに使う minor release では、そこへ流し込む中間 PR が
  # 構造的に無検査で通っていた (v0.3.0 実測: #927 / #929 / #930 / #931 / #932 /
  # #938 / #939 / #940 / #941 / #942 / #943 の 11 本。#938 は Python 実装 3 +
  # テスト 3 を変更しながら走った check は `validate-checklist` 1 個だけ)。
  #
  # **`push.branches` (上記 L10-11) には `release/*` を足さない。** 足すと
  # `release/* -> main` の PR は release ブランチの生存期間ずっと open なので、
  # 同一 commit に対し push run (`github.ref=refs/heads/release/vX`) と
  # pull_request run (`github.ref=refs/pull/N/merge`) の 2 本が起動する。下の
  # concurrency group は ref を含む (L26) ため別 group となり dedupe されず、
  # windows runner を含む full CI が丸ごと 2 倍走る。
  #
  # この filter が見ていない集合: branches filter は allowlist なので、ここに
  # 列挙しない base (将来 `hotfix/*` 等を切る場合) は依然として無検査のままになる。
  # 「全 base をカバーした」ことは意味しない。
  pull_request:
    branches: [main, "develop-*", "release/*"]

concurrency:
  # 同一 ref への連続 push は前 run を cancel して無駄を省く。ただし main /
  # develop-* は cache warm-up が目的なので cancel しない (PR の場合のみ cancel)。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          # block scalar 必須。スカラのままカンマ区切りにすると setup-python は
          # 全体を 1 個の glob として扱い、constraints.txt が無視される。
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Cache FFmpeg archive
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /tmp/ffmpeg.tar.xz
          key: btbn-ffmpeg-linux64-lgpl-shared-8.1-b31223cb8074205dd9f908aa032f68826adaefbaee40fcb6be8e34f9b8cb72c4

      - name: Download FFmpeg archive (cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # BtbN は daily autobuild を ~14 日で GC するため、daily pin は ~14 日で 404 する。
          # 各月末日 daily (autobuild-YYYY-MM-{28,29,30,31}-*) は ~24 ヶ月保持されるため
          # monthly snapshot に pin する (#705 で確定、本 PR で daily → monthly に切替)。
          # 2026-04-30 monthly は upstream FFmpeg n8.1 + 11 commits (g75d37c499d、OLD format)。
          # bump 手順 + checksums.sha256 取得方法は scripts/build-portable-zip.ps1 line 70-95 参照。
          curl -fsSL -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-04-30-13-44/ffmpeg-n8.1-11-g75d37c499d-linux64-lgpl-shared-8.1.tar.xz"

      - name: Install ffmpeg (BtbN LGPLv3 n8.1 shared, pinned monthly)
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_SHA256="b31223cb8074205dd9f908aa032f68826adaefbaee40fcb6be8e34f9b8cb72c4"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ffmpeg
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          # Shared build: exe wrappers load DLL/SO siblings from ../lib.
          echo "LD_LIBRARY_PATH=/tmp/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="/tmp/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" /tmp/ffmpeg/bin/ffmpeg -version
          LD_LIBRARY_PATH="/tmp/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" /tmp/ffmpeg/bin/ffprobe -version

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Regenerate Python metadata types from JSON Schema
        run: python scripts/codegen/generate.py --py

      - name: Verify generated metadata_types.py is up to date (#612)
        shell: bash
        run: |
          if ! git diff --exit-code allaganeye/metadata_types.py; then
            echo "::error::allaganeye/metadata_types.py is stale relative to schemas/metadata.schema.json. Run 'python scripts/codegen/generate.py --py' locally and commit the result."
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: pyright

      - name: Test (exclude tests/hooks/ — runs in hook-test job)
        run: pytest --ignore=tests/hooks/

  # #934: path sandbox の **Windows 固有の解決** を CI で踏むための狭い job。
  #
  # 上の `python` job は ubuntu なので、`E:foo` (drive-relative) や `..\x.mp4`
  # (backslash 区切り) が出力先の外を指すかどうかは **一度も Windows の意味論で
  # 評価されない**。`\` も `:` も POSIX では正当なファイル名文字なので、ubuntu 上では
  # 「出力先の中に留まる」側だけが踏まれ、Windows 側の解決が壊れても緑のままになる。
  # 本 project は Windows 向けに配布する CLI で、ここは #930 で実際にデータ損失を
  # 出した書込 sandbox と同じ経路なので、その差分だけを Windows で回す。
  #
  # #965 で `scripts/check_doc_code_refs.py` の MAX_PATH 回避も同じ理由でここに
  # 相乗りしている (Windows でしか症状が出ない = ubuntu job では revert しても緑)。
  # job 名は #934 由来のままだが、**扱う対象は「Windows 固有の path 意味論」全般**。
  #
  # **全スイートは回さない** — ffmpeg / GPU を要する経路は既存の job と実機検証の
  # 担当であり、ここを太らせると Windows runner の待ち時間だけが増える。
  # `export_cli` を除外しているのは、CLI 経路が encoder 列挙で ffmpeg を要求するため
  # (この job は ffmpeg を入れない)。resolver 層の path 判定はすべて含まれている。
  python-windows-path-sandbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      # shell: bash を明示する。既定の pwsh は native command の stderr を
      # NativeCommandError へ包み、exit 0 でも $? を false にすることがある
      # (docs/l2-workflow.md / PowerShell の既知の罠)。
      # `check_doc_code_refs` の MAX_PATH 回避 (#965) は Windows 固有で、
      # ubuntu では `_extended` が no-op になるため ubuntu の python job では
      # 検証できない。ここに入れないと「実装を revert しても全 CI が緑」になる。
      - name: Test (path sandbox / metadata contracts / doc-code-refs)
        shell: bash
        run: pytest tests/test_export_pool.py tests/test_path_schema_contracts.py tests/scripts/test_check_doc_code_refs.py -q -k "not export_cli"

  hook-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          # block scalar 必須。スカラのままカンマ区切りにすると setup-python は
          # 全体を 1 個の glob として扱い、constraints.txt が無視される。
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
          # jsonschema も constraints 経由にする。ここを素通しにすると同一
          # workflow 内に constraints 非適用の解決が 1 本残る。
          pip install jsonschema -c constraints.txt

      - name: Install jq (for format-cleanup-log.sh smoke test)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate cleanup-output schema
        run: |
          python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('schemas/cleanup-output.schema.json'))); print('schema OK')"

      - name: Hook tests
        run: pytest tests/hooks/ -v --tb=short

      # tests/scripts/test_*.sh は .github/scripts/ の error-hint-drift 検査
      # (check-error-hint-drift.sh / extract-*.awk) の test harness。
      # audit 2026-06-10 P3「CI 参照ゼロ」対応 (#816)。glob 配線にして
      # 将来の test_*.sh 追加忘れを防ぎ、空 glob は配線退行として fail させる。
      - name: Shell test harness (tests/scripts/test_*.sh)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/scripts/test_*.sh)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::tests/scripts/test_*.sh matched no files (wiring regression, audit 2026-06-10 P3 / #816)"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "=== ${t} ==="
            bash "$t"
          done

  gui-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      - name: Regenerate TypeScript metadata types from JSON Schema
        working-directory: gui
        run: node scripts/generate-ts.mjs

      - name: Verify generated metadata.generated.ts is up to date (#612)
        shell: bash
        run: |
          if ! git diff --exit-code gui/src/types/metadata.generated.ts; then
            echo "::error::gui/src/types/metadata.generated.ts is stale relative to schemas/metadata.schema.json. Run 'python scripts/codegen/generate.py --ts' (or 'cd gui && npm run generate-types') locally and commit the result."
            exit 1
          fi

      - name: Lint
        working-directory: gui
        run: npm run lint

      - name: Type check
        working-directory: gui
        run: npm run typecheck

      - name: Test
        working-directory: gui
        run: npm test

      - name: Build
        working-directory: gui
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist
          path: gui/dist
          retention-days: 1

  gui-rust:
    runs-on: windows-latest
    # #767 -- needs: gui-frontend を削除して並列実行可能に (~60s wall clock 短縮)。
    # cargo test --lib は frontend assets (gui/dist) を参照しないため、
    # gui-frontend の build artifact に依存する必要がない (lib test 内に
    # include_dir! / include_str!(...dist) / frontendDist / AssetResolver の
    # 使用が無いことを grep で確認済)。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install node dependencies
        working-directory: gui
        run: npm ci

      # #767 -- --no-default-features で default feature "custom-protocol"
      # (tauri release-mode bundling 用) を無効化。lib test は custom_protocol /
      # asset_resolver / AssetResolver を参照しないことを grep で確認済。
      # build 時間短縮 + cargo dependency graph 縮小に寄与する。
      - name: Cargo test (lib)
        run: cargo test --lib --no-default-features --manifest-path gui/src-tauri/Cargo.toml

  doc-tauri-commands-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tauri-commands.md drift vs lib.rs (name-level set-diff)
        shell: bash
        run: |
          set -euo pipefail
          # 1. lib.rs から #[tauri::command] 直後の関数名を抽出 (sync/async 両対応、awk で grep -P 不要)
          awk '/^#\[tauri::command\]/{getline; sub(/^.*fn[[:space:]]+/, ""); sub(/[(].*$/, ""); print}' \
            gui/src-tauri/src/lib.rs | sort -u > /tmp/lib_commands.txt
          # 2. doc table 1 列目の command 名を抽出 (`backtick` 囲み)
          grep -E "^\| [0-9]+ \|" docs/tauri-commands.md \
            | awk -F'|' '{print $3}' | tr -d '` ' | sort -u > /tmp/doc_commands.txt
          # 3. set 比較 — rename / 誤コピー / 行数だけ合致するケースも検出
          if ! diff -u /tmp/lib_commands.txt /tmp/doc_commands.txt; then
            echo "::error::docs/tauri-commands.md drift: command name mismatch. Update docs/tauri-commands.md to match gui/src-tauri/src/lib.rs (issue #619)."
            exit 1
          fi
          LIB_COUNT=$(wc -l < /tmp/lib_commands.txt)
          echo "OK: $LIB_COUNT tauri commands documented (name-level match)"

  doc-error-hint-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check error.rs ↔ docs/tauri-commands.md hint mapping drift
        shell: bash
        run: bash .github/scripts/check-error-hint-drift.sh

  doc-code-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # scripts/check_doc_code_refs.py は標準ライブラリのみで動くため
      # pip install を持たない (依存を増やさず job を軽く保つ)。
      # exit 1 = 参照が壊れている / exit 2 = 検査自体が壊れている (#912 / #910)。
      - name: Check doc -> code references (link / symbol / spawn coverage)
        shell: bash
        run: python scripts/check_doc_code_refs.py

  feature-announcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # SSoT は typer runtime registry (`typer.main.get_command(app).commands`)
      # なので、`doc-code-refs` と違い CLI を import できる状態が要る。
      # `allaganeye/cli.py` の `@app.command` を静的走査する実装だと、
      # #944 で実際に漏れた `minimap` / `export` (どちらも `register(app)` 経由)
      # がちょうど検査対象外になる。
      - name: Install allaganeye (CLI registry を読むため)
        run: pip install -e . -c constraints.txt

      # 同梱 README.txt は source を grep せず pwsh で実際に描画して検査する
      # (here-string / 関数境界の取り違えによる false-green を避けるため)。
      # pwsh は ubuntu-latest runner にプリインストールされている。
      # exit 1 = 告知漏れ / exit 2 = 検査自体が壊れている (#944)。
      - name: Check shipped CLI subcommands are announced in entry docs
        shell: bash
        run: python scripts/check_feature_announcement.py

  screenshot-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # scripts/check_screenshot_freshness.py は標準ライブラリのみで動くため
      # pip install を持たない。**git 履歴も使わない**: actions/checkout@v4 の
      # 既定 fetch-depth: 1 では `git log -- <path>` が全ファイルについて同じ
      # 1 commit を返し、commit 日時比較も blob 変化点の追跡も無条件 green に
      # なる (2026-08-20 実測)。照合は source の内容ハッシュで行う。
      # exit 1 = 撮り直し漏れ / exit 2 = 検査自体が壊れている (#944)。
      - name: Check README screenshots are captured from current GUI sources
        shell: bash
        run: python scripts/check_screenshot_freshness.py

  changelog-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # scripts/check_changelog_style.py は標準ライブラリのみで動くため
      # pip install を持たない。走査対象は `## [Unreleased]` (無ければ最新
      # version セクション) のみで、既リリース済みセクションは見ない (裁定 D7)。
      # exit 1 = 規約違反 / exit 2 = 検査自体が壊れている (#952)。
      # 規約の正は docs/release-process.md §CHANGELOG entry の記述規約。
      - name: Check CHANGELOG entry style (internal jargon / Internal section)
        shell: bash
        run: python scripts/check_changelog_style.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on all .sh files
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: '.'

  installer-pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # #876 -- PSGallery / PowerShellGet は windows runner 上で間欠的に
      # "No match was found for the specified search criteria and module name
      # 'Pester'" を返す (PR #874 で実発生。19 分前の #871 マージ run では成功
      # していたので transient)。retry で自癒させ、この job の結果が
      # 「Pester テストの成否」だけを反映するようにする。
      #
      # **成否判定を Install-Module の error semantics に委ねない。**
      # PackageManagement のエラーは -ErrorAction Stop / $ErrorActionPreference
      # を素通りして非終了のまま抜けることがあるため、毎 attempt の後に
      # `Get-Module -ListAvailable` で **実際に 5.0.0 以上が入ったか** を確認する。
      # これが無いと「install に失敗したのに retry せず次へ進み、後段で落ちる」
      # 経路が残り、retry が silent な no-op になる。
      #
      # この retry が見ていない集合:
      #   - PSGallery が恒久障害なら 3 回とも失敗して従来どおり red になる (正しい)
      #   - module の cache 化はしていないので install 自体は毎 run 走る
      #     (#876 の選択肢 (b) は不採用。cache key の陳腐化という別の穴を作るため)
      #   - **正常時には永久に不発**。通常の PR では 1 回目で成功するので、
      #     この分岐が生きているかは通常の緑からは分からない (発火実証は
      #     存在しないモジュール名を流して行う。PR 本文に run URL を記録)
      - name: Install Pester v5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleName = 'Pester'
          $minVersion = [version]'5.0.0'
          $maxAttempts = 3
          $installed = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Install-Module $moduleName -MinimumVersion $minVersion -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
            } catch {
              Write-Host "::warning::Install-Module ${moduleName}: attempt ${attempt}/${maxAttempts} threw: $($_.Exception.Message)"
            }
            $installed = Get-Module -ListAvailable -Name $moduleName |
              Where-Object { $_.Version -ge $minVersion } |
              Sort-Object Version -Descending |
              Select-Object -First 1
            if ($null -ne $installed) { break }
            Write-Host "::warning::${moduleName} >= ${minVersion} still not available after attempt ${attempt}/${maxAttempts}"
            if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds (15 * $attempt) }
          }
          if ($null -eq $installed) {
            throw "Install-Module ${moduleName}: version ${minVersion} or later is not available after ${maxAttempts} attempt(s)"
          }
          Write-Host "Installed ${moduleName} $($installed.Version) on attempt ${attempt}/${maxAttempts}"
          Import-Module $moduleName -MinimumVersion $minVersion
          (Get-Module $moduleName).Version

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path scripts/tests/ -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester: $($result.FailedCount) test(s) failed"
          }
