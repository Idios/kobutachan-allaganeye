name: CI

on:
  pull_request:
    branches: [main, "develop-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install ffmpeg (BtbN LGPLv3 n8.1 static, pinned)
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-04-22-13-15/ffmpeg-n8.1-10-g7f5c90f77e-linux64-lgpl-8.1.tar.xz"
          FFMPEG_SHA256="863a5eb145a06529f3ce3c1ee4908abb24ac60d63b47659af9d696abbca9257e"
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ffmpeg
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          /tmp/ffmpeg/bin/ffmpeg -version
          /tmp/ffmpeg/bin/ffprobe -version

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: pyright

      - name: Test
        run: pytest

  gui-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      - name: Lint
        working-directory: gui
        run: npm run lint

      - name: Type check
        working-directory: gui
        run: npm run typecheck

      - name: Test
        working-directory: gui
        run: npm test

      - name: Build
        working-directory: gui
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist
          path: gui/dist
          retention-days: 1

  gui-rust:
    runs-on: windows-latest
    needs: gui-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install node dependencies
        working-directory: gui
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-dist
          path: gui/dist

      - name: Cargo check
        run: cargo check --manifest-path gui/src-tauri/Cargo.toml
