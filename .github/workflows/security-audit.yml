name: Security Audit

on:
  pull_request:
    paths:
      - 'gui/src-tauri/Cargo.lock'
      - 'gui/src-tauri/Cargo.toml'
      - 'gui/package-lock.json'
      - 'gui/package.json'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-audit:
    name: cargo audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.22"

      - name: Run cargo audit
        working-directory: gui/src-tauri
        # default: vulnerability 検出時のみ fail。warning (unmaintained / unsound)
        # は通過させる (現状 19 件の deferred warnings が存在、tauri 上流 patch 待ち)
        run: cargo audit

  dependency-review:
    name: dependency review (GitHub Advisory DB)
    runs-on: ubuntu-latest
    # 本 action は base/head を持つイベントでしか動かない。この workflow は
    # workflow_dispatch も受けるため、その経路では skip する (付けないと手動実行が
    # 常に red になる)。cargo-audit / npm-audit は従来どおり手動実行できる。
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # cargo audit / npm audit が構造的に見えない脆弱性を塞ぐ 3 本目の gate。
      # 参照 DB が違う: cargo audit = RustSec、npm audit = npm registry、本 job =
      # GitHub Advisory Database。実例として serde_with の GHSA-7gcf-g7xr-8hxj は
      # RustSec に advisory が無く、当該 lockfile に対して cargo audit は exit 0
      # (green) を返していた (#931 で doc 化した構造的ギャップ)。
      #
      # 本 workflow の `on: pull_request` には `branches:` フィルタが無いため、
      # ci.yml が起動しない release/* 宛の PR でも走る。依存更新はまさにその経路で
      # 入ることがある (#931 は release/v0.3.0 宛で Cargo.lock を変更した)。
      #
      # バージョンは exact pin。本 action は moving major tag (v5 等) を発行して
      # おらず v5.0.0 のような完全版タグしか無いため、更新は手動 bump が必要。
      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          # moderate 以上で fail。動機となった serde_with は medium だったので
          # high では取りこぼす。npm audit の `--audit-level=high` より厳しいが、
          # 本 job は manifest が変わった PR でしか起動しない (上の paths filter)
          # ため、ノイズは依存を触る PR に限定される。
          fail-on-severity: moderate
          # 既定は `runtime, development` で **unknown を除外する**。本 repo の
          # 現状は cargo=runtime / npm=development / pip=runtime で unknown は 0 件
          # だが、scope を解決できない依存が将来現れたとき silent に素通しさせない
          # ため明示する (false green を作らない)。
          fail-on-scope: runtime, development, unknown

  npm-audit:
    name: npm audit (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: gui
        # npm audit は package-lock.json を直接読むため `npm ci` 不要 (gui-frontend job と
        # 重複していた installation step を除去、~20-40s 短縮)
        # high 以上で fail。dev-only の moderate/low は通過 (現状 ajv moderate
        # ReDoS が deferred 状態、Track A で fast-uri は 3.1.2 解消済)
        run: npm audit --audit-level=high
