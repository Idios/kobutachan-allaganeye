name: PR Checklist Validation

on:
  pull_request:
    types: [opened, edited, synchronize]

# Fable 欄の semantic 検査が PR の変更ファイル一覧を読むため明示宣言する (#945)。
# ambient default に依存すると、default が絞られた瞬間に gate が fail-closed で落ちる。
permissions:
  contents: read
  pull-requests: read

jobs:
  validate-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PR checklist
        uses: actions/github-script@v7
        with:
          script: |
            const checker = require('./.github/scripts/check-pr-checklist.js');
            await checker({ github, context, core });
