[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobutachan-allaganeye"
version = "0.2.0"
description = "FF14 Frontline video auto-highlight extraction tool"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
]

[project.scripts]
allaganeye = "allaganeye.cli:app"

[tool.setuptools.packages.find]
include = ["allaganeye*"]

[tool.setuptools.package-data]
"allaganeye.audio.refs" = ["*.npz"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests requiring video files (deselect with '-m \"not slow\"')",
    "slow_probe: probe-only slow tests",
    "slow_detect: detection slow tests",
    "slow_pipeline: full pipeline slow tests",
    "slow_gpu: GPU-specific slow tests",
    "baseline_regen: marks tests only needed during baseline regeneration",
    "real_audio_scan: opt out of the autouse _run_audio_scan mock (#288)",
]
addopts = "-m 'not slow and not baseline_regen'"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "S", "UP", "RUF"]
ignore = [
    "S603",    # subprocess call - process trusted input
    "S607",    # partial executable path - ffmpeg/ffprobe are PATH-dependent
    "S101",    # assert in tests OK
    "E501",    # line length managed by formatter
    "RUF001",  # ambiguous unicode (Japanese OK)
    "RUF002",  # ambiguous unicode (Japanese OK)
    "RUF003",  # ambiguous unicode (Japanese OK)
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
exclude = ["tmp", ".venv", "build", "dist"]
