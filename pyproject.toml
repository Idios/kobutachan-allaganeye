[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobutachan-allaganeye"
version = "0.3.0"
description = "FF14 Frontline video auto-highlight extraction tool"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # click 8.4 / typer 0.25+ は click 例外を typer._click 名前空間へ分離し、
    # cli.py の単一ダッシュ hint (NoSuchOption 捕捉) と debug_brightness の
    # typer.Exit 捕捉を破壊する (CI 2026-05-27、develop-0.3.0 全体が赤化)。
    # 既知 good ライン (typer 0.24.x / click 8.3.x) に pin して回帰を防ぐ。
    # click は cli.py / tests が直接 import するため明示依存として宣言。
    "typer>=0.9,<0.25",
    "click>=8.0,<8.4",
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
]

[project.scripts]
allaganeye = "allaganeye.cli:main"

[tool.setuptools.packages.find]
include = ["allaganeye*"]

[tool.setuptools.package-data]
"allaganeye.audio.refs" = ["*.npz"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pyright>=1.1",
    "datamodel-code-generator>=0.25",
    "jsonschema>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests requiring video files (deselect with '-m \"not slow\"')",
    "slow_probe: probe-only slow tests",
    "slow_detect: detection slow tests",
    "slow_pipeline: full pipeline slow tests",
    "slow_gpu: GPU-specific slow tests",
    "baseline_regen: marks tests only needed during baseline regeneration",
    "real_audio_scan: opt out of the autouse _run_audio_scan mock (#288)",
]
addopts = "-m 'not slow and not baseline_regen' --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "S", "UP", "RUF"]
ignore = [
    "S603",    # subprocess call - process trusted input
    "S607",    # partial executable path - ffmpeg/ffprobe are PATH-dependent
    "S101",    # assert in tests OK
    "E501",    # line length managed by formatter
    "RUF001",  # ambiguous unicode (Japanese OK)
    "RUF002",  # ambiguous unicode (Japanese OK)
    "RUF003",  # ambiguous unicode (Japanese OK)
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
exclude = ["tmp", ".venv", "build", "dist"]
